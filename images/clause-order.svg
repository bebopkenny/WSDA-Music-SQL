<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="859" height="519" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="430.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Anatomy of a query</text>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<text x="155.0" y="78" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="600">The order you write it</text>
<text x="565.0" y="78" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="600">The order SQLite runs it</text>
<rect x="60" y="100" width="190" height="36" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
<text x="155.0" y="123" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">SELECT</text>
<rect x="60" y="148" width="190" height="36" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" />
<text x="155.0" y="171" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">FROM</text>
<rect x="60" y="196" width="190" height="36" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" />
<text x="155.0" y="219" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">JOIN ... ON</text>
<rect x="60" y="244" width="190" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="155.0" y="267" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">WHERE</text>
<rect x="60" y="292" width="190" height="36" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" />
<text x="155.0" y="315" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">GROUP BY</text>
<rect x="60" y="340" width="190" height="36" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" />
<text x="155.0" y="363" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">HAVING</text>
<rect x="60" y="388" width="190" height="36" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" />
<text x="155.0" y="411" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">ORDER BY</text>
<rect x="60" y="436" width="190" height="36" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" />
<text x="155.0" y="459" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">LIMIT</text>
<rect x="470" y="100" width="190" height="36" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" />
<text x="484" y="123" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">1</text>
<text x="565.0" y="123" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">FROM</text>
<text x="676" y="123" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">pick the table(s)</text>
<rect x="470" y="148" width="190" height="36" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" />
<text x="484" y="171" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">2</text>
<text x="565.0" y="171" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">JOIN ... ON</text>
<text x="676" y="171" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">stitch tables together</text>
<rect x="470" y="196" width="190" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
<text x="484" y="219" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">3</text>
<text x="565.0" y="219" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">WHERE</text>
<text x="676" y="219" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">filter rows</text>
<rect x="470" y="244" width="190" height="36" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" />
<text x="484" y="267" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">4</text>
<text x="565.0" y="267" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">GROUP BY</text>
<text x="676" y="267" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">make groups</text>
<rect x="470" y="292" width="190" height="36" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" />
<text x="484" y="315" font-size="13" fill="#6d28d9" text-anchor="start" font-weight="700">5</text>
<text x="565.0" y="315" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">HAVING</text>
<text x="676" y="315" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">filter groups</text>
<rect x="470" y="340" width="190" height="36" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
<text x="484" y="363" font-size="13" fill="#c2410c" text-anchor="start" font-weight="700">6</text>
<text x="565.0" y="363" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">SELECT</text>
<text x="676" y="363" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">pick / compute columns</text>
<rect x="470" y="388" width="190" height="36" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" />
<text x="484" y="411" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">7</text>
<text x="565.0" y="411" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">ORDER BY</text>
<text x="676" y="411" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">sort the result</text>
<rect x="470" y="436" width="190" height="36" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5" />
<text x="484" y="459" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">8</text>
<text x="565.0" y="459" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">LIMIT</text>
<text x="676" y="459" font-size="13" fill="#6b7280" text-anchor="start" font-weight="400">cut it down</text>
<path d="M254,118.0 C360,118.0 360,358.0 464,358.0" fill="none" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M254,166.0 C360,166.0 360,118.0 464,118.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M254,214.0 C360,214.0 360,166.0 464,166.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M254,262.0 C360,262.0 360,214.0 464,214.0" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M254,310.0 C360,310.0 360,262.0 464,262.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M254,358.0 C360,358.0 360,310.0 464,310.0" fill="none" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#arr)"/>
<path d="M254,406.0 C360,406.0 360,406.0 464,406.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
<path d="M254,454.0 C360,454.0 360,454.0 464,454.0" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="430" y="506" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">SELECT is written first but happens late, which is why WHERE can&#x27;t see an aggregate and HAVING exists.</text>
</svg>
