<svg xmlns="http://www.w3.org/2000/svg" width="920" height="476" viewBox="0 0 920 476" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="919" height="475" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="460.0" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Types of joins</text>
<defs>
<clipPath id="ca0"><circle cx="135" cy="175" r="72"/></clipPath>
<clipPath id="cb0"><circle cx="205" cy="175" r="72"/></clipPath>
<clipPath id="ca1"><circle cx="435" cy="175" r="72"/></clipPath>
<clipPath id="cb1"><circle cx="505" cy="175" r="72"/></clipPath>
<clipPath id="ca2"><circle cx="735" cy="175" r="72"/></clipPath>
<clipPath id="cb2"><circle cx="805" cy="175" r="72"/></clipPath>
</defs>
<rect x="20" y="62" width="280" height="360" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" />
<circle cx="205" cy="175" r="72" fill="#2563eb" fill-opacity="0.55" clip-path="url(#ca0)"/>
<circle cx="135" cy="175" r="72" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<circle cx="205" cy="175" r="72" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="103" y="180" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="600">Invoice</text>
<text x="237" y="180" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="600">Customer</text>
<text x="160.0" y="278" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">INNER JOIN</text>
<text x="160.0" y="300" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">only rows that match in both</text>
<text x="36" y="352" font-size="12" fill="#1f2937" font-family="Consolas, Menlo, Monaco, monospace" xml:space="preserve">FROM Invoice AS i</text>
<text x="36" y="371" font-size="12" fill="#1f2937" font-family="Consolas, Menlo, Monaco, monospace" xml:space="preserve">INNER JOIN Customer AS c</text>
<text x="36" y="390" font-size="12" fill="#1f2937" font-family="Consolas, Menlo, Monaco, monospace" xml:space="preserve">  ON i.CustomerId = c.CustomerId</text>
<rect x="320" y="62" width="280" height="360" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" />
<circle cx="435" cy="175" r="72" fill="#2563eb" fill-opacity="0.55"/>
<circle cx="435" cy="175" r="72" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<circle cx="505" cy="175" r="72" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="403" y="180" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="600">Invoice</text>
<text x="537" y="180" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="600">Customer</text>
<text x="460.0" y="278" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">LEFT OUTER JOIN</text>
<text x="460.0" y="300" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">everything from the left table,</text>
<text x="460.0" y="318" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">plus matches (NULL where none)</text>
<text x="336" y="352" font-size="12" fill="#1f2937" font-family="Consolas, Menlo, Monaco, monospace" xml:space="preserve">FROM Invoice AS i</text>
<text x="336" y="371" font-size="12" fill="#1f2937" font-family="Consolas, Menlo, Monaco, monospace" xml:space="preserve">LEFT OUTER JOIN Customer AS c</text>
<text x="336" y="390" font-size="12" fill="#1f2937" font-family="Consolas, Menlo, Monaco, monospace" xml:space="preserve">  ON i.CustomerId = c.CustomerId</text>
<rect x="620" y="62" width="280" height="360" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" />
<circle cx="805" cy="175" r="72" fill="#2563eb" fill-opacity="0.55"/>
<circle cx="735" cy="175" r="72" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<circle cx="805" cy="175" r="72" fill="none" stroke="#1f2937" stroke-width="1.6"/>
<text x="703" y="180" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="600">Invoice</text>
<text x="837" y="180" font-size="12.5" fill="#1f2937" text-anchor="middle" font-weight="600">Customer</text>
<text x="760.0" y="278" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700" font-family="Consolas, Menlo, Monaco, monospace">RIGHT OUTER JOIN</text>
<text x="760.0" y="300" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">everything from the right table,</text>
<text x="760.0" y="318" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="400">plus matches (NULL where none)</text>
<text x="636" y="352" font-size="12" fill="#1f2937" font-family="Consolas, Menlo, Monaco, monospace" xml:space="preserve">FROM Invoice AS i</text>
<text x="636" y="371" font-size="12" fill="#1f2937" font-family="Consolas, Menlo, Monaco, monospace" xml:space="preserve">RIGHT OUTER JOIN Customer AS c</text>
<text x="636" y="390" font-size="12" fill="#1f2937" font-family="Consolas, Menlo, Monaco, monospace" xml:space="preserve">  ON i.CustomerId = c.CustomerId</text>
<text x="460" y="450" font-size="12.5" fill="#6b7280" text-anchor="middle" font-weight="400">SQLite only added RIGHT and FULL OUTER JOIN in version 3.39 (2022). Before that, the move was to swap the tables and use a LEFT JOIN.</text>
</svg>
